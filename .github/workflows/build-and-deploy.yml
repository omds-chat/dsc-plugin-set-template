name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 只读仓库内容,发布 Pages 与换取 OIDC 令牌所需的权限除此之外一概不给。
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 按 .github/plugins-sources.json 收录插件;清单为空时脚本直接返回 0。
      # 收录会复制作者侧分离签名与作者公钥,不生成合集签名。
      - name: Import plugins
        run: node scripts/import-plugins.mjs

      # 根证书二选一,优先级从高到低:
      #   1. secrets.ROOT_CA_PEM  根证书 PEM 文本,适合不便公开拉取的场景;
      #   2. vars.ROOT_CA_URL     根证书下载地址,默认取 online-data 分支的 root_ca.crt。
      - name: Resolve root CA
        env:
          ROOT_CA_PEM: ${{ secrets.ROOT_CA_PEM }}
          ROOT_CA_URL: ${{ vars.ROOT_CA_URL }}
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/root_ca.crt"
          if [ -n "${ROOT_CA_PEM:-}" ]; then
            printf '%s\n' "$ROOT_CA_PEM" > "$target"
            echo "根证书来源:secrets.ROOT_CA_PEM"
          elif [ -n "${ROOT_CA_URL:-}" ]; then
            curl -fsSL "$ROOT_CA_URL" -o "$target"
            echo "根证书来源:$ROOT_CA_URL"
          else
            echo "缺少根证书:请设置 secrets.ROOT_CA_PEM 或 vars.ROOT_CA_URL" >&2
            exit 1
          fi
          echo "ROOT_CA_PATH=$target" >> "$GITHUB_ENV"

      # 强校验:终端签名证书必须由该根证书签发,且未过期、keyUsage 含 digitalSignature、
      # basicConstraints 为 CA:FALSE。证书路径不写死:与校验脚本共用 pki.mjs 的解析,
      # 先找 certs/<合集 id>-eec.crt,旧的根目录 eec.pem 仅作兼容回退,回退删除后本步骤无需改动。
      - name: Verify EEC against root CA
        run: |
          set -euo pipefail
          eec="$(node -e "import('./scripts/pki.mjs').then((m) => { const r = m.resolveEecCertPath(process.cwd()); if (!r.exists) { console.error('找不到终端签名证书:' + r.candidates.map((c) => c.rel).join(' 或 ')); process.exit(1); } process.stdout.write(r.path); })")"
          echo "终端签名证书:$eec"
          openssl verify -CAfile "$ROOT_CA_PATH" "$eec"
          openssl x509 -in "$eec" -noout -subject -issuer -enddate
          openssl x509 -in "$eec" -noout -ext keyUsage
          openssl x509 -in "$eec" -noout -ext basicConstraints
          openssl x509 -in "$eec" -noout -checkend 0

      # 用 EEC 私钥为三层清单与每个版本的 plugin.js 生成 CMS 分离签名,并生成 dist/。
      # 私钥只从 secret 读取,且必须与合集内的终端签名证书配对,否则步骤直接失败。
      - name: Build distribution
        env:
          EEC_SECRET_KEY: ${{ secrets.EEC_SECRET_KEY }}
        run: node scripts/build-collection.mjs --dir . --root-ca "$ROOT_CA_PATH" --sign --out dist

      # 对即将分发的产物再做一次完整校验:证书链、CMS 签名、作者签名、清单与版本目录。
      - name: Verify distribution
        run: node scripts/verify-collection.mjs --dir dist --root-ca "$ROOT_CA_PATH"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
